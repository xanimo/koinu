# Builds the library and the cli and runs the tests, on each platform and word
# size the wallet claims to support, then again under the sanitizers and the
# fuzzers on one of them. The word size matters: the compiler that only ever
# sees 64-bit misses a 128-bit intrinsic that is not there on 32-bit, and the
# byte-order work wants more than one target.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-gcc
            os: ubuntu-24.04
            cc: gcc
          - name: linux-x86_64-clang
            os: ubuntu-24.04
            cc: clang
          - name: linux-i386-gcc
            os: ubuntu-24.04
            cc: gcc
            bits32: true
          # macos-latest rather than a pinned image, which has now cost two
          # outages: macos-13 was retired and a job queued for one waited
          # indefinitely rather than failing, and macos-14 was brownt out on
          # 2026-10-30 ahead of retiring on 2026-11-02, failing in one second
          # with every other job green. The pin bought reproducibility that was
          # never used and an expiry date that was never watched. There is no
          # x86_64 job: the label tracks arm64 and the retired x86_64 images
          # stall the matrix rather than failing it.
          - name: macos-arm64-clang
            os: macos-latest
            cc: clang
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      # pinned: a tag is mutable and this workflow runs on every push
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          submodules: recursive

      - name: dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool
          if [ "${{ matrix.bits32 }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends gcc-multilib
          fi

      - name: dependencies (macos)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool

      # secp256k1 has to be built for the same word size as everything else,
      # or the link fails on an incompatible architecture rather than a bug.
      - name: build secp256k1 (32-bit)
        if: matrix.bits32 == true
        run: |
          cd depends/secp256k1
          ./autogen.sh
          ./configure --enable-static --disable-shared --with-pic --disable-tests \
              --disable-exhaustive-tests --disable-benchmark \
              --host=i686-pc-linux-gnu CFLAGS=-m32 LDFLAGS=-m32
          make

      - name: check
        run: |
          if [ "${{ matrix.bits32 }}" = "true" ]; then
            make check CC=${{ matrix.cc }} \
              CFLAGS="-std=gnu11 -O2 -g -Wall -Wextra -Wno-unused-parameter -m32"
          else
            make check CC=${{ matrix.cc }}
          fi

      # built, not run: each wants a live peer. A link error here is a change
      # that broke a diagnostic nobody compiles until they need it.
      - name: tools
        run: |
          if [ "${{ matrix.bits32 }}" = "true" ]; then
            make tools CC=${{ matrix.cc }} \
              CFLAGS="-std=gnu11 -O2 -g -Wall -Wextra -Wno-unused-parameter -m32"
          else
            make tools CC=${{ matrix.cc }}
          fi

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      # pinned: a tag is mutable and this workflow runs on every push
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends autoconf automake libtool
      - run: make asan
      - run: KW_FUZZ_ITERS=50000 make fuzz-asan
